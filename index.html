<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="lan-origin" content="">
<meta name="theme-color" content="#100e19">
<title>重力夾球場 · Gravity Claw</title>
<meta name="api-origin" content="https://gravity-claw-arcade.easyflame18.chatgpt.site/">
<link rel="stylesheet" href="./style.css">
<script type="module" src="./arcade.js"></script>
</head>
<body>
<main id="display" aria-label="重力夾球場" hidden>
  <canvas id="stage" aria-label="3D 球池及玩家夾爪"></canvas>
  <img id="game-title" src="./title.png" width="840" height="252" alt="博愛大都心 · Growing with the City, Rooted in Its Stories" draggable="false">
  <div id="claw-scores"></div>
  <a id="join-link" target="_blank" rel="noopener" aria-label="開啟手機控制板"><canvas id="qr" aria-hidden="true"></canvas></a>
  <div class="visually-hidden">
    <span id="players">0 / 5 位玩家</span>
    <span id="feedback" role="status">等待玩家加入</span>
  </div>
</main>
<main id="claw-picker" aria-label="選擇夾爪" hidden>
  <button type="button" data-claw="long" aria-label="長爪，抓取範圍較大，最多三件"><img src="./claw-long.png" width="240" height="208" alt=""></button>
  <button type="button" data-claw="standard" aria-label="標準爪，最多一件"><img src="./claw-standard.png" width="240" height="208" alt=""></button>
  <button type="button" data-claw="short" aria-label="短爪，抓持力較強，最多一件"><img src="./claw-short.png" width="240" height="208" alt=""></button>
</main>
<main id="controller" aria-label="控制板" hidden>
  <p id="connection" class="visually-hidden" role="status">正在連線…</p>
  <button id="leave" type="button" disabled>離開房間</button>
  <div class="control-deck">
    <p id="stick-label" class="visually-hidden">前後左右移動</p>
    <div id="stick" tabindex="0" role="group" aria-labelledby="stick-label" aria-keyshortcuts="ArrowUp ArrowDown ArrowLeft ArrowRight" inert>
      <span class="stick-back" aria-hidden="true">▲</span><span class="stick-left" aria-hidden="true">◀</span>
      <b aria-hidden="true"></b><span class="stick-right" aria-hidden="true">▶</span><span class="stick-front" aria-hidden="true">▼</span>
    </div>
    <button id="grab" type="button" disabled>夾取</button>
  </div>
</main>
</body></html>
